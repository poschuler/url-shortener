# Local stack. Values come from .env (see .env.example); the app reaches
# Postgres and Redis by service name, so the hosts are overridden here.
name: url-shortener

services:
  # Applies the database migrations, then exits. The APIs wait for it.
  migrate:
    image: url-shortener
    build: .
    command: ["node", "--enable-source-maps", "dist/entrypoints/migrate.js"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:?set PG_USER in .env}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      PG_NAME: ${PG_NAME:?set PG_NAME in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: url-shortener
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      MAX_URL_LENGTH: ${MAX_URL_LENGTH:-2048}
      SHORT_CODE_KEY: ${SHORT_CODE_KEY:?set SHORT_CODE_KEY in .env}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SHORTEN_RATE_LIMIT_MAX: ${SHORTEN_RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:?set PG_USER in .env}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      PG_NAME: ${PG_NAME:?set PG_NAME in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # The write side on its own: Shorten only, no Redis.
  write-api:
    image: url-shortener
    build: .
    command: ["node", "--enable-source-maps", "dist/entrypoints/write-api.js"]
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      MAX_URL_LENGTH: ${MAX_URL_LENGTH:-2048}
      SHORT_CODE_KEY: ${SHORT_CODE_KEY:?set SHORT_CODE_KEY in .env}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SHORTEN_RATE_LIMIT_MAX: ${SHORTEN_RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:?set PG_USER in .env}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      PG_NAME: ${PG_NAME:?set PG_NAME in .env}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_USER:?set PG_USER in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_NAME:?set PG_NAME in .env}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # A cache only: no snapshots, no append-only file.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
